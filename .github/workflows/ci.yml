name: CI

on:
  push:
    branches: [main, grimore-v2]
  pull_request:
    branches: [main, grimore-v2]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json's `packageManager` field
      # already pins the exact pnpm, and action-setup@v4 refuses to start when
      # both are present — which is why every run since 2026-08-21 failed
      # before reaching a single check.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
